rolling(){let[c,x]=canvasBase(760,620),stageNo=1,sel=select(Array.from({length:500},(_,i)=>[i+1,'Stage '+(i+1)]),1);btn('스테이지 시작',start,true);let left=false,right=false,stop=()=>{};control('◀',()=>left=true,()=>left=false);control('▶',()=>right=true,()=>right=false);function start(){stop();stageNo=+sel.value;let r=seeded(stageNo),lane=1,px=380,dist=0,alive=true,obs=[],spawn=0,speed=250+Math.min(260,stageNo*.55);setMsg('Stage '+stageNo+' 시작! 좌우로 피해서 100%까지 가면 클리어.');function makeObs(){let l=Math.floor(r()*3),wide=r()<.18;obs.push({lane:l,y:-80,h:wide?55:38,w:wide?200:150})}stop=rafLoop(dt=>{if(!alive)return;let target=230+lane*150;if(keys.arrowleft||keys.a||left){lane=Math.max(0,lane-1);left=false}if(keys.arrowright||keys.d||right){lane=Math.min(2,lane+1);right=false}px+=(target-px)*Math.min(1,dt*13);spawn-=dt;if(spawn<=0){makeObs();spawn=Math.max(.28,.72-stageNo/1100)+r()*.25}obs.forEach(o=>o.y+=speed*dt);obs=obs.filter(o=>o.y<700);let me={x:px-21,y:498,w:42,h:44};if(obs.some(o=>hit(me,{x:165+o.lane*150+(150-o.w)/2,y:o.y,w:o.w,h:o.h}))){alive=false;stop();setMsg('Stage '+stageNo+' 실패 · 진행도 '+Math.floor(dist/18)+'%')}dist+=speed*dt/14;if(dist>=1800){alive=false;stop();saveBest('rolling',stageNo);setMsg(stageNo===500?'🎉 500 스테이지 완주!':'Stage '+stageNo+' 클리어! 다음 스테이지로 넘어갈 수 있어.');if(stageNo<500)sel.value=stageNo+1}setStats({스테이지:stageNo,진행:Math.min(100,Math.floor(dist/18))+'%',최고클리어:best('rolling')});x.fillStyle='#07101c';x.fillRect(0,0,760,620);for(let i=0;i<3;i++){x.fillStyle=i%2?'#12203b':'#0f1a31';x.fillRect(155+i*150,0,145,620)}for(let y=(dist%55)-55;y<620;y+=55){x.fillStyle='#ffffff16';x.fillRect(155,y,445,2)}x.fillStyle='#65a9ff';x.beginPath();x.arc(px,520,23,0,7);x.fill();obs.forEach(o=>{x.fillStyle='#ff5d79';x.fillRect(165+o.lane*150+(150-o.w)/2,o.y,o.w,o.h)});x.fillStyle='#fff';x.font='bold 22px system-ui';x.fillText('STAGE '+stageNo,20,35);x.fillText(Math.min(100,Math.floor(dist/18))+'%',650,35)}) ;cleanup=()=>stop()}start()},
